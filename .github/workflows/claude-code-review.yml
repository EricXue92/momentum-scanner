name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true  # DIAG: surface the hidden error text
          # The previous configuration used `plugin_marketplaces` +
          # `plugins: code-review@claude-code-plugins` to invoke a slash-
          # command-based reviewer. As of 2026-05-06, the action's plugin
          # install path is broken on hosted runners — it tries to spawn
          # `/home/runner/.local/bin/claude` which doesn't exist. Issuing
          # the review request inline removes the dependency on the
          # marketplace machinery.
          prompt: |
            Review pull request ${{ github.repository }}/pull/${{ github.event.pull_request.number }}
            for code quality, correctness, and adherence to the project
            conventions documented in CLAUDE.md. Focus on the changed
            files only. Post a top-level summary plus inline comments on
            any specific concerns. Skip the review if the PR is solely
            documentation or trivial config changes.
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

