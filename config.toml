# ════════════════════════════════════════════════════════════
#  全局设置 (通用 + 美股专属阈值)
# ════════════════════════════════════════════════════════════
[settings]
output_dir = "output"
delay_between_requests = 8.0
output_format = "comma"          # "comma" = AAPL,MSFT  |  "newline" = 一行一个

# 美股全局过滤
min_dollar_volume = 100_000_000  # Longs: price × 20日均量 ≥ $100M
# ADR% = mean((High-Low)/Close) over last `adr_days` bars × 100。捕捉
# catalyst 波动、过滤无波动的票。套用 Longs/Leaders/RS/Shorts/Morning Gap。设 0 关闭。
min_adr_percent = 4.0
adr_days = 20

# 美股 IBD RS 闸门 (0-99 百分位, vs SPY)
# 数据源: Fred6725/rs-log/output/rs_stocks.csv (工作日 ~01:30 UTC 刷新)。
# 表中没有的票 (新 IPO / 外国挂牌) 保留不删。任一阈值设 0 关闭该层
# (12M 两个都为 0 才跳过 GitHub 拉取; 3M 设 0 跳过 yfinance batch)。
# 作用范围 (12M ∩ 3M 双闸):
#   Longs 5 组   → 仅 12M (min_rs_percentile_longs)
#   Leaders      → 12M (min_rs_percentile) + 3M
#   条件 RS 组    → 12M (min_rs_percentile_rs, 缺省继承 min_rs_percentile_longs) + 3M
#   US Shorts    → 12M (min_rs_percentile_shorts, 缺省继承 min_rs_percentile_longs) + 3M
#   US IPO(≥64天) → 仅 3M
min_rs_percentile        = 0   # Leaders 12M (≥80 = top 20%) # 80
min_rs_percentile_longs  = 90    # Longs 5 组 12M (≥90 = top 10%)
min_rs_percentile_rs     = 0     # 条件 RS 组 12M 层已关闭; 只走下方 3M 单闸
min_rs_percentile_shorts = 0     # US Shorts 12M 层已关闭; 只走下方 3M 单闸
min_rs_percentile_3m     = 90    # 3M 层

# 美股 IPO ladder 阈值 (Finviz 屏过但 yfinance 历史不足的票)
min_market_cap = 300_000_000     # USD; = Finviz cap_smallover
min_price      = 20.0            # USD; = Finviz sh_price_o20
min_avg_volume = 500_000         # 20日股/天; = Finviz sh_avgvol_o500
# min_dollar_volume / min_adr_percent 复用上方 [settings] 值

# RS line 趋势 (TraderLion 式 RS line = 价/指数, vs 它自己的 EMA)。
# 两条判据路径共用本段参数:
#   1) EOD 标注 (位置 + 持续性) —— 云端 (update_us_rs_3m / update_hk_rs)
#      从已有 k 线算 rs_below_ma / rs_days_below_ma / rs_frac_below_ma 三列,
#      本地只读列做日志标注。不改 .txt / dedup 输出。
#      参数: ma_length, ma_type, persistence_window, min_history。
#   2) rs-line-audit 审计 (均线斜率 + 反转豁免) —— 手动跑
#      `uv run main.py --mode rs-line-audit` 时, 对 eod_seen_{US,HK}.txt
#      里的每只票算 RS-line EMA 的 lookback 天斜率 chg, 满足
#      `chg < -tolerance` 且 `5日涨幅 < adr_mult × ADR%` → DROP, 从 master
#      里裁掉 (先备份)。历史不足 / 单日 ≥50% 跳变 → unknown, 保留。
#      参数: lookback, tolerance, adr_mult (外加上面的 ma_length/ma_type/
#      min_history)。
[rs_line]
enabled = true
ma_length = 21          # 对齐 TraderLion RS-line 均线 (用户确认 EMA21)
ma_type = "ema"         # "ema" | "sma"
persistence_window = 20 # EOD 标注用: rs_frac_below_ma 的回看交易日数
min_history = 42        # 对齐后不足此根数 → unknown (排除, 不标注 / 不审计)
# ===================== ⭐ 常调参数 TUNABLE ⭐ =====================
# 下面 3 个是审计路径最常调的旋钮, 审计后在这里校准。搜索 "TUNE" 即可定位。
lookback  = 5           # TUNE ⭐ EMA 斜率回看天数 (5 bar = 一个交易周)
tolerance = 0.005       # TUNE ⭐ 破位线: chg < -0.5% 即方向转弱 (噪声带, 工作假设)
adr_mult  = 1.0         # TUNE ⭐ 反转豁免: 5日涨幅 ≥ adr_mult×ADR% 则暂留。调高=更严苛/只留最强反转(代价:可能误砍真反转); 调低=更宽容/少被洗出
top_n     = 10          # 每日 RS 最强快照条数 (audit 写 output/rs_us_<date>.txt / hk_rs_<date>.txt)
# ================================================================
# EOD 标注路径目前只输出三列, 未引入硬阈值。待观察真实分布后在 v2 加:
#   drop_days_below = ...   # 连续在均线下方天数
#   drop_frac_below = ...   # persistence_window 内占比

# SMA50 剪除: us-eod 开跑前排查 eod_seen_US.txt, 收盘价连续 N 天低于 SMA50
# 且最新收盘低于前一日收盘 (仍在下跌, 线下反弹的票保留) 的股票从 master 移除
# (先备份 .bak.<stamp>), 走弱票未来重新走强可再入选。
# 软失败: yfinance 整体失败则跳过; 单票数据缺失/历史不足 50 根 → 保留。仅 US。
[sma50_prune]
enabled = true
consecutive_days = 2

# ════════════════════════════════════════════════════════════
#  美股 (US)
# ════════════════════════════════════════════════════════════

# Longs: 5 子策略，按下方 list 顺序内部互斥去重，各自单独输出。
# 优先级 (高→低): EarningsGap > HighVolume > GapUp > NewHigh52W > TopGainers。
# 并集再参与 Longs > Leaders 的跨组去重。
[[longs]]
key = "earnings_gap"
name = "Earnings Gap"
filters = ["ind_stocksonly","cap_smallover","earningsdate_today","sh_avgvol_o500","sh_price_o20","sh_relvol_o1.5","ta_gap_u5","ta_sma50_pa","ta_sma200_pa"]

[[longs]]
key = "high_volume"
name = "Relative Volume Surge"
filters = ["ind_stocksonly","cap_smallover","sh_avgvol_o500","sh_price_o20","ta_perf_dup","ta_sma50_pa","ta_sma200_pa"]
min_relative_volume = 3
relative_volume_days = 20

[[longs]]
key = "gap_up"
name = "Gap Up"
filters = ["ind_stocksonly","cap_smallover","sh_avgvol_o500","sh_price_o20","ta_gap_u3","ta_sma50_pa","ta_sma200_pa"]

[[longs]]
key = "new_high_52w"
name = "52W New High"
filters = ["ind_stocksonly","cap_smallover","sh_avgvol_o500","sh_price_o20","ta_highlow52w_nh","ta_sma200_pa","ta_sma50_pa"]

[[longs]]
key = "top_gainers"
name = "Top Gainers"
signal = "ta_topgainers"
filters = ["ind_stocksonly","cap_smallover","sh_avgvol_o500","sh_price_o20","ta_sma50_pa","ta_sma200_pa"]

# EOD Repeat: 已在跨日 master (output/state/eod_seen_US.txt) 里、今天又命中
# 事件类 Longs 子组的老票 —— 汇总到 <date>_Repeat.txt 供每日复查。
# 只读 master (不写回、不影响各组自身"只出新票"的语义)。keys 留空 = 关闭。
# 刻意排除 new_high_52w / Leaders: 它们是持续状态，会天天复燃刷屏。
[eod_repeat]
enabled = true
keys = ["earnings_gap", "high_volume", "gap_up", "top_gainers"]
file_stem = "Repeat"

# Leaders: 强势 + 站上 SMA50/SMA200，5 个 perf 窗口合并去重，输出 Leaders.txt。
# 共同条件: cap ≥ small、avg vol > 500K、price > $20。
# 全局 min_dollar_volume ($100M) 和 min_adr_percent (≥4.0%) 自动套用。
[[leaders]]
name = "Leaders 4W +30%"
filters = ["ind_stocksonly","cap_smallover","sh_avgvol_o500","sh_price_o20","ta_perf_4w30o","ta_sma200_pa","ta_sma50_pa"]

[[leaders]]
name = "Leaders 13W +50%"
filters = ["ind_stocksonly","cap_smallover","sh_avgvol_o500","sh_price_o20","ta_perf_13w50o","ta_sma200_pa","ta_sma50_pa"]

[[leaders]]
name = "Leaders 26W +100%"
filters = ["ind_stocksonly","cap_smallover","sh_avgvol_o500","sh_price_o20","ta_perf_26w100o","ta_sma200_pa","ta_sma50_pa"]

[[leaders]]
name = "Leaders YTD +100%"
filters = ["ind_stocksonly","cap_smallover","sh_avgvol_o500","sh_price_o20","ta_perf_ytd100o","ta_sma200_pa","ta_sma50_pa"]

[[leaders]]
name = "Leaders 52W +150%"
filters = ["ind_stocksonly","cap_smallover","sh_avgvol_o500","sh_price_o20","ta_perf_52w150o","ta_sma200_pa","ta_sma50_pa"]

# Shorts: 基于 Kristjan Kullamägi 的做空筛选，输出 Shorts.txt。
[shorts]
name = "Short Candidates"
filters = ["ind_stocksonly", "ta_sma20_pa20", "ta_sma50_pa", "sh_avgvol_o1000", "cap_microover"]
min_dollar_volume = 100_000_000
min_consecutive_up_days = 3
# 按市值分级的月涨幅阈值 (%)
perf_large_cap = 50     # ≥ $10B
perf_mid_cap = 200      # $2B–$10B
perf_small_cap = 300    # $50M–$2B

# RS: 条件触发，仅当 SPY 和 QQQ 当日都跌 ≥ 1.0% 时运行。
[rs]
name = "Relative Strength"
filters = ["ind_stocksonly","cap_smallover","sh_avgvol_o500","sh_price_o20","ta_perf_dup","ta_sma200_pa","ta_sma50_pa"]

# Morning Gap: 盘前 -20/-10/-5 + 盘后 +5/+10/+15/+20/+25/+30 分钟扫描。
# 负 offset = 盘前 (→ MorningGapPre{N}.txt, 跳过盘中累计量过滤);
# 正 offset = 盘后 (→ MorningGap{N}.txt, 累计量须 ≥ 20日均量)。
# 每个 offset 独立留档一个文件; 0 结果的扫描不生成文件。
# Discovery 走 Futu snapshot (取代 Finviz ta_topgainers — 后者会surface上周
# 盘中涨幅而非今日盘前 gapper)。盘前用 pre_change_rate; 盘后用
# (last_price - prev_close_price) / prev_close_price 推导。
[morning_gap]
name = "Morning Gap Up"
exchanges = ["US_NASDAQ", "US_NYSE", "US_AMEX"]
min_gap_percent = 5.0           # 盘后 discovery
min_gap_percent_pre = 5.0       # 盘前 discovery (负 offset); 不设则回落到 min_gap_percent
min_market_cap = 300_000_000    # USD; = Finviz cap_smallover
min_price = 20.0                # USD; = Finviz sh_price_o20
min_avg_volume = 500_000        # 20日股/天; = Finviz sh_avgvol_o500
avg_volume_days = 20
min_dollar_volume = 100_000_000
scan_offsets = [-20, -10, -5, 5, 10, 15, 20, 25, 30]
offset_tolerance_minutes = 2
# 趋势闸 (SMA50/SMA200) 的比较基准: true = 盘前/实时价, false = 昨收 (旧行为)。
# 均线本身始终用已完成日线计算,不受此开关影响。
sma_use_live_price = true
# gap ≥ 此值时豁免 SMA50 (SMA200 永不豁免); 0 = 关闭豁免。
sma_bypass_gap_percent = 10.0
# ADR% 默认继承 [settings] (min_adr_percent / adr_days); 可在此覆盖。
# 大 gap ADR% 旁路: gap ≥ adr_bypass_gap_percent 时, ADR% 门槛放宽到
# adr_bypass_min_percent (低波动大盘股财报 gap — 如 SNOW 2026-09-03 盘前 +5%
# 但 ADR% 3.68 < 4.0 — 否则永远报不出来)。gap_percent 设 0 关闭旁路;
# min_percent 设 0 = gap 够大即完全豁免 ADR%。
adr_bypass_gap_percent = 10.0
adr_bypass_min_percent = 3.0

# ════════════════════════════════════════════════════════════
#  港股 (HK)
# ════════════════════════════════════════════════════════════

# HK 长线 5 组共用基线 (EarningsGap / HighVolume / GapUp / Leaders / 条件 RS)。
# 数据源: yfinance (k-line + HSI) + Futu (市值 + HSI 实时日涨幅)。阈值用 HKD。
# EarningsGap 用形态 (gap + RVol) 替代财报日历。
[hk_settings]
min_market_cap          = 300_000_000     # HKD
min_dollar_volume       = 100_000_000     # HKD; 价 × 20日均量, 对齐美股 $100M
min_avg_volume          = 500_000         # 5 个长线组统一日均量 (Shorts 另设 1M)
# ADR% 调低至 3.0 (US 用 4.0)。HK 蓝筹波动率结构性偏低 — 在"放过百强股"
# 和"还能筛掉静态低波动股"之间取折中。
min_adr_percent         = 3.0
min_price               = 20.0            # HKD
# RS 闸 (对齐美股结构, vs HSI, 云端 IBD 算法), 按组分工:
#   事件组 EarningsGap/HighVolume/GapUp → 仅 12M (min_rs_percentile_longs, ≙ 美股 Longs)
#   Leaders / 条件 RS 组                → 仅 3M  (min_rs_percentile_longs_3m, ≙ 美股 Leaders/RS)
#   HK IPO (≥64天)                      → 仅 3M (复用 min_rs_percentile_longs_3m)
#   HK Shorts                           → 仅 3M ([hk_shorts].min_rs_percentile_3m, ≙ 美股 Shorts)
# 任一键设 0 关闭对应层。
min_rs_percentile_longs    = 90           # 事件组 12M (≥90 = top 10%)
min_rs_percentile_longs_3m = 90           # Leaders/RS/IPO 3M (≥90 = top 10%)
hsi_rs_trigger          = -1.0            # HSI 当日跌幅 ≤ 此值则触发 RS 组

# HK Shorts: 基于 HKEX 数据的做空筛选，输出 output/TV/HK/<date>_Shorts.txt。
# 保留独立 1M 日均量门槛 (与 US Shorts 对称)。
[hk_shorts]
name = "HK Short Candidates"
# 3M RS 单闸 (对齐美股 Shorts): 在 yfinance 批量下载前先筛 universe;
# 表中缺失的票保留; 缺省继承 [hk_settings].min_rs_percentile_longs_3m; 设 0 关闭。
min_rs_percentile_3m = 90
min_avg_volume = 1_000_000             # 日均成交量 (股) — Shorts 独有
min_market_cap = 50_000_000            # HKD
min_dollar_volume = 100_000_000        # HKD; 对齐美股 Shorts $100M
min_consecutive_up_days = 3
# 按市值分级的月涨幅阈值 (%)
perf_large_cap = 50                    # ≥ 100亿 HKD
perf_mid_cap = 200                     # 20亿–100亿 HKD
perf_small_cap = 300                   # 5000万–20亿 HKD
# 市值分界线 (HKD)
large_cap_threshold = 10_000_000_000
mid_cap_threshold = 2_000_000_000

# HK Longs: 3 子策略，方法学对齐 US Longs，各自单独输出。
[[hk_longs]]
key = "earnings_gap"
name = "HK Earnings Gap"
min_relative_volume = 3
min_gap_percent = 3.0

[[hk_longs]]
key = "high_volume"
name = "HK Relative Volume Surge"
min_relative_volume = 3

[[hk_longs]]
key = "gap_up"
name = "HK Gap Up"
min_gap_percent = 3.0

# HK Leaders: 5 个 perf 窗口合并去重，输出 Leaders.txt。
[[hk_leaders]]
name = "HK Leaders 4W +30%"
min_perf_4w = 30

[[hk_leaders]]
name = "HK Leaders 13W +50%"
min_perf_13w = 50

[[hk_leaders]]
name = "HK Leaders 26W +100%"
min_perf_26w = 100

[[hk_leaders]]
name = "HK Leaders YTD +100%"
min_perf_ytd = 100

[[hk_leaders]]
name = "HK Leaders 52W +150%"
min_perf_52w = 150

# HK RS: 条件触发，仅当 HSI 当日跌幅 ≤ hsi_rs_trigger 时运行。
# 入选须当日收红 (last > prev_close, ≙ 美股 ta_perf_dup)。
[hk_rs]
name = "HK Relative Strength"

# HK Morning Gap: 仅盘后 (港股无 Futu 盘前数据)。09:30 HKT 开盘后
# +10/+20/+30/+40/+50/+60 分钟扫描。gap = (last - prev_close) / prev_close。
# 基线门槛对齐 [hk_settings] 长仓。累计量过滤用 Futu snapshot 的 volume
# (当日 RTH 累计) ≥ 20日均量; 无 yfinance 1m fallback。
[hk_morning_gap]
name = "HK Morning Gap Up"
exchanges = ["HK_MAINBOARD"]
min_gap_percent = 5.0           # 港股仅盘后一档; 对齐美股盘前 (min_gap_percent_pre)
min_market_cap = 300_000_000    # HKD
min_price = 20.0                # HKD
min_avg_volume = 500_000        # 20日股/天
avg_volume_days = 20
min_dollar_volume = 100_000_000 # HKD; 20日均量 × 最新收盘
scan_offsets = [10, 20, 30, 40, 50, 60]
offset_tolerance_minutes = 2
# 同美股: 趋势闸比较基准用实时价 (港股仅盘后, 即 last_price), gap ≥ 10% 豁免 SMA50。
sma_use_live_price = true
sma_bypass_gap_percent = 10.0
# min_adr_percent / adr_days 默认继承 [hk_settings] (3.0% / 20d); 可在此覆盖。
# 大 gap ADR% 旁路 (同美股 adr_bypass_gap_percent / adr_bypass_min_percent)
# 代码已接线但此处不启用: HK 基线已是 3.0, 放宽到 3.0 是无效操作;
# 若要启用需配一个更低的 min_percent, 例如:
# adr_bypass_gap_percent = 10.0
# adr_bypass_min_percent = 2.0


# ════════════════════════════════════════════════════════════
#  共享基础设施 (Futu 同步 / 推送 / 报告)
# ════════════════════════════════════════════════════════════

# Futu (富途牛牛) 自动同步 — 需本地运行 FutuOpenD，分组须在客户端预先建好
# (API 不能新建分组)。
[futu]
enabled = true
host = "127.0.0.1"
port = 11111
# append_only_groups: 扫描只 ADD 不 DEL，与跨日 master 'seen' 文件配对
# (每个票首次出现进且仅进一个组，Futu 组单调累积)。组太满时在客户端手动清空
# (Futu 上限: 非交易户 500/组，活跃交易户 2000)。
append_only_groups = [
    # 美股
    "EarningsGap",
    "HighVolume",
    "GapUp",
    "NewHigh52W",
    "TopGainers",
    "Leaders",
    "Shorts",
    "RS",
    "IPO",
    # 港股
    "HKShorts",
    "HKEarningsGap",
    "HKHighVolume",
    "HKGapUp",
    "HKLeaders",
    "HKRS",
    "HKIPO",
    "HKMorningGap",
]

[futu.groups]
# --- 美股 ---
# EarningsGap 是合并的 "gap watch" 组: EOD 财报缺口 + 盘前/盘后 morning-gap
# 都同步进来 (append-only)。
longs_earnings_gap = "EarningsGap"
morning_gap = "EarningsGap"
morning_gap_pre = "EarningsGap"
longs_high_volume = "HighVolume"
longs_gap_up = "GapUp"
longs_new_high_52w = "NewHigh52W"
longs_top_gainers = "TopGainers"
# eod_repeat: 老票复燃汇总。默认不同步 —— 想同步先在牛牛客户端手建
# 同名分组 (API 建不了组)，再取消下面这行的注释。
# eod_repeat = "Repeat"
shorts = "Shorts"
rs = "RS"
leaders = "Leaders"
# IPO: 长线候选中被 yfinance 因历史不足丢弃的票，独立跨日 master，append-only。
ipo = "IPO"
# --- 港股 ---
hk_shorts = "HKShorts"
hk_longs_earnings_gap = "HKEarningsGap"
hk_longs_high_volume  = "HKHighVolume"
hk_longs_gap_up       = "HKGapUp"
hk_leaders            = "HKLeaders"
hk_rs                 = "HKRS"
# HK IPO: 历史不足 12 个月的港股主板新股，独立跨日 master。
hk_ipo                = "HKIPO"
# HK morning-gap (盘后扫描，无 _pre 变体)。
hk_morning_gap        = "HKMorningGap"

# TradingView 自动同步 — 通过非官方 REST API + sessionid cookie 认证。
# 凭证读取顺序: env (TV_SESSIONID, TV_SESSIONID_SIGN) →
#   ~/.config/momentum-scanner/tv_cookie.json (建议 chmod 600)。
# 18 个列表必须先在 TV 网页手动建好 (名字区分大小写、一字不差);
# 找不到对应名字 → warning + 跳过该列表, 不会自动创建。
# Cookie 过期同样 soft-fail (跟 Futu OpenD 不可达同语义),
# 不会阻塞主流程。
[tv_sync]
enabled = false
# append_only_lists: 跟 [futu].append_only_groups 同语义 — 只 ADD 不 DEL,
# 跨日累积。建议跟 Futu 那边保持一致避免行为分裂。
append_only_lists = [
    # 美股
    "EarningsGap", "MorningGap", "HighVolume", "GapUp", "NewHigh52W",
    "TopGainers", "Leaders", "Shorts", "RS", "IPO",
    # 港股
    "HKShorts", "HKEarningsGap", "HKHighVolume", "HKGapUp", "HKLeaders",
    "HKRS", "HKIPO", "HKMorningGap",
]

[tv_sync.lists]
# --- 美股 ---
# 与 Futu 不同: TV 上 MorningGap 跟 EarningsGap 拆开 (Futu 那边三者并入
# EarningsGap)。morning_gap 和 morning_gap_pre 合并到同一个 MorningGap。
longs_earnings_gap = "EarningsGap"
morning_gap        = "MorningGap"
morning_gap_pre    = "MorningGap"
longs_high_volume  = "HighVolume"
longs_gap_up       = "GapUp"
longs_new_high_52w = "NewHigh52W"
longs_top_gainers  = "TopGainers"
# eod_repeat: 同上 —— 需先在 TV 网页手建同名列表后再取消注释。
# eod_repeat        = "Repeat"
shorts             = "Shorts"
rs                 = "RS"
leaders            = "Leaders"
ipo                = "IPO"
# --- 港股 ---
hk_shorts             = "HKShorts"
hk_longs_earnings_gap = "HKEarningsGap"
hk_longs_high_volume  = "HKHighVolume"
hk_longs_gap_up       = "HKGapUp"
hk_leaders            = "HKLeaders"
hk_rs                 = "HKRS"
hk_ipo                = "HKIPO"
hk_morning_gap        = "HKMorningGap"

# 推送通知 (ntfy.sh) — morning-gap 发现"新"票时推送到 phone + Mac 浏览器。
# 同一交易日内已出现的票不重复推送 (state: output/state/morning_gap_seen_<date>.txt)。
# topic 名后缀是随机串 = 私人频道。
[notify]
enabled = true
ntfy_topic = "xue-finviz-morning-gap-9f3k2"
ntfy_server = "https://ntfy.sh"
max_tickers_in_body = 100

# 报告生成 LLM backend — 选哪个模型生成 CANSLIM 日报。所有后端都走 Anthropic
# SDK 协议 (非 Anthropic 厂商经各自的 /anthropic 兼容端点)，区别在 web 搜索来源:
#   anthropic — 原生 web_search_20250305 (单次请求, 质量最好, ~$1-2/天 per market)
#   deepseek / kimi / glm / minimax — 各厂商模型 + Tavily (tool-call 循环, 便宜
#               ~80%, ~$0.5/天; 需 TAVILY_API_KEY + 对应厂商 key:
#               DEEPSEEK_API_KEY / MOONSHOT_API_KEY / ZHIPUAI_API_KEY / MINIMAX_API_KEY)
# 每个后端可选配 [report.<name>] 段覆盖 model / base_url / max_tokens /
# max_search_calls，缺省值见 report/llm.py 的 _COMPAT_PROVIDERS。
[report]
# backend = "anthropic"
backend = "DeepSeek"

[report.anthropic]
model = "claude-sonnet-4-6"   # claude-opus-4-7
max_tokens = 3500
web_search_max_uses = 2

[report.deepseek]
model = "deepseek-v4-pro"
base_url = "https://api.deepseek.com/anthropic"
max_tokens = 3500
max_search_calls = 2   # 仅在 [report.evidence].enabled = false 或盘前 catalyst 路径时生效

[report.evidence]
# 证据包预取(spec: docs/superpowers/specs/2026-09-09-report-evidence-prefetch-design.md)。
# 程序先从 yfinance(新闻 / 分析师 / 财报日历)+ EDGAR(近期公告)拉证据,LLM 只调一次;
# 证据条数(news + filings)低于 min_items_for_no_search 时才允许 fallback_search_calls 次 Tavily。
# enabled = false 回到旧的 tool-loop 行为(上面各后端的 max_search_calls 生效)。
enabled = true
news_max_items = 10
news_max_age_hours = 720        # 30 天
news_summary_chars = 300
filings_days = 60               # 仅 US;HK 无公告源
filings_max_items = 8
analyst_grades_days = 90
search_fallback = true
min_items_for_no_search = 3
fallback_search_calls = 1
timeout_seconds = 20

# [report.kimi]
# model = "kimi-k2-turbo-preview"           # base_url 缺省 https://api.moonshot.cn/anthropic
# [report.glm]
# model = "glm-4.6"                         # base_url 缺省 https://open.bigmodel.cn/api/anthropic
# [report.minimax]
# model = "MiniMax-M2"                      # base_url 缺省 https://api.minimax.io/anthropic

[morning_gap_catalyst]
# Pre-market catalyst report. Runs as detached subprocess after the
# morning-gap scan finds fresh US pre-market gappers. Independent from
# the EOD [report] backend selection — always uses DeepSeek + Tavily.
enabled = true
max_tickers_per_run = 10
concurrency = 3
max_search_calls = 3
deepseek_model = "deepseek-v4-pro"
